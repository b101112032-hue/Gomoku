<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 藝術禪意五子棋 - MQTT 線上雙人與 AI 對戰</title>
    <!-- 引入 Paho MQTT 客戶端 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --wood-dark: #3e2723;
            --wood-medium: #5d4037;
            --wood-board: #deb887;
            --gold: #d4af37;
            --bg-grad-1: #1a1c23;
            --bg-grad-2: #2c163a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* 藝術背景光影流動效果 */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(138, 43, 226, 0.05) 60%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* 頂部標題 */
        header {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            background: linear-gradient(to right, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #b0bec5;
            margin-top: 4px;
        }

        /* MQTT 連線狀態提示橫幅 */
        .mqtt-status-banner {
            position: relative;
            z-index: 2;
            background: rgba(30, 30, 45, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .mqtt-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #f44336;
            box-shadow: 0 0 6px #f44336;
            transition: all 0.3s;
        }

        .mqtt-dot.connected {
            background-color: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        /* 主遊戲區塊：左右玩家面板 + 中間棋盤 */
        .game-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 2;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        /* 玩家面板 (左/右) */
        .player-panel {
            background: rgba(30, 30, 40, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 15px;
            width: 210px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .player-panel.active-turn {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #444, #222);
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 2px solid var(--gold);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f44336;
            margin-right: 5px;
        }

        .status-dot.online {
            background-color: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }

        .status-text {
            font-size: 0.78rem;
            color: #cfd8dc;
            margin-top: 5px;
        }

        /* 聊天室專區 */
        .chat-box {
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 6px;
            text-align: left;
        }

        .chat-messages {
            height: 90px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 5px;
            font-size: 0.73rem;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-msg {
            word-break: break-all;
            color: #e0e0e0;
        }

        .chat-msg span {
            color: var(--gold);
            font-weight: bold;
        }

        .chat-input-group {
            display: flex;
            gap: 4px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 3px 6px;
            font-size: 0.73rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 4px;
            color: white;
            outline: none;
        }

        .chat-input-group button {
            padding: 3px 7px;
            font-size: 0.73rem;
        }

        /* 3D 立體木紋五子棋盤 */
        .board-wrapper {
            perspective: 1200px;
        }

        .gomoku-board {
            display: grid;
            grid-template-columns: repeat(15, 34px);
            grid-template-rows: repeat(15, 34px);
            background-color: #dcb35c;
            border: 8px solid var(--wood-dark);
            border-radius: 6px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 
                        inset 0 0 25px rgba(0,0,0,0.3);
            transform: rotateX(15deg);
            transform-style: preserve-3d;
            padding: 8px;
        }

        .intersection {
            width: 34px;
            height: 34px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intersection::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #5c4033;
        }

        .intersection::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background-color: #5c4033;
        }

        .stone {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset -2px -2px 4px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }

        .stone.black {
            background: radial-gradient(circle at 35% 35%, #666 0%, #111 60%, #000 100%);
        }

        .stone.white {
            background: radial-gradient(circle at 35% 35%, #fff 0%, #e0e0e0 60%, #bbb 100%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset -2px -2px 4px rgba(150,150,150,0.5);
        }

        /* 控制台與設定 */
        .control-panel {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 30, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            max-width: 720px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 10px;
            border-radius: 6px;
            color: white;
            outline: none;
            font-size: 0.85rem;
            width: 120px;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
        }

        button {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #1a1c23;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
            font-size: 0.85rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.5);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #game-log {
            margin-top: 8px;
            font-size: 0.82rem;
            color: #b0bec5;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZEN GOMOKU 3D</h1>
        <div class="subtitle">Artistic Zen Edition · MQTT Live Multiplay & AI</div>
    </header>

    <div class="mqtt-status-banner">
        <div class="mqtt-dot" id="mqtt-global-dot"></div>
        <span id="mqtt-global-text">MQTT 伺服器狀態：尚未連線（請於下方輸入房間並加入）</span>
    </div>

    <div class="game-container">
        <!-- 左側玩家 (黑棋) -->
        <div class="player-panel" id="panel-black">
            <div class="player-avatar">⚫</div>
            <h3 id="black-title">黑棋 (P1)</h3>
            <div class="status-text">
                <span class="status-dot" id="dot-black"></span><span id="text-black">等待中</span>
            </div>
        </div>

        <!-- 中間 3D 立體五子棋盤 -->
        <div class="board-wrapper">
            <div class="gomoku-board" id="gomoku-board"></div>
        </div>

        <!-- 右側玩家 (白棋) 與 聊天室 -->
        <div class="player-panel" id="panel-white">
            <div class="player-avatar">⚪</div>
            <h3 id="right-player-title">白棋 (AI 機器人)</h3>
            <div class="status-text">
                <span class="status-dot" id="dot-white"></span><span id="text-white">AI 待命</span>
            </div>

            <div class="chat-box">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-msg"><span>系統：</span>歡迎來到五子棋對戰聊天室</div>
                </div>
                <div class="chat-input-group">
                    <input type="text" id="chat-input" placeholder="聊天..." onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChatMessage()">發送</button>
                </div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label style="font-size: 0.82rem; color:#b0bec5;">模式:</label>
            <button id="mode-btn" onclick="toggleMode()">切換: 對戰 AI</button>
        </div>
        <div class="control-group">
            <input type="text" id="room-input" placeholder="輸入房間代碼" value="gomoku_room_108">
            <button onclick="joinRoom()">加入房間</button>
        </div>
        <div class="control-group">
            <button class="secondary" onclick="resetGame()">重新開局</button>
        </div>
    </div>

    <div id="game-log">狀態：請選擇模式或加入線上房間開始對戰</div>

    <script>
        const BOARD_SIZE = 15;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
        let turn = 'black'; 
        let gameMode = 'ai'; 
        let client = null;
        let roomId = 'gomoku_room_108';
        const clientId = 'gomoku_user_' + Math.random().toString(36).substring(2, 7);
        const playerName = '棋手_' + Math.floor(Math.random() * 900 + 100);
        let gameOver = false;

        function renderBoard() {
            const boardEl = document.getElementById('gomoku-board');
            boardEl.innerHTML = '';

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const intersection = document.createElement('div');
                    intersection.className = 'intersection';
                    intersection.dataset.row = r;
                    intersection.dataset.col = c;

                    const piece = board[r][c];
                    if (piece) {
                        const stone = document.createElement('div');
                        stone.className = `stone ${piece}`;
                        intersection.appendChild(stone);
                    }

                    intersection.addEventListener('click', () => handleIntersectionClick(r, c));
                    boardEl.appendChild(intersection);
                }
            }

            document.getElementById('panel-black').classList.toggle('active-turn', turn === 'black');
            document.getElementById('panel-white').classList.toggle('active-turn', turn === 'white');
        }

        function handleIntersectionClick(r, c) {
            if (gameOver) return;
            if (board[r][c] !== '') return;

            makeMove(r, c, turn);

            if (gameMode === 'ai' && !gameOver && turn === 'white') {
                setTimeout(makeAIMove, 500);
            }
        }

        function makeMove(r, c, player) {
            board[r][c] = player;
            renderBoard();

            if (checkWin(r, c, player)) {
                gameOver = true;
                const winnerName = (player === 'black') ? '黑棋' : '白棋';
                showLog(`🎉 遊戲結束！獲勝者是：${winnerName}`);
                appendChatMessage("系統", `🎉 遊戲結束！獲勝者是：${winnerName}`);
                return;
            }

            turn = (player === 'black') ? 'white' : 'black';
            showLog(`落子於 (${r + 1}, ${c + 1})，目前輪到：${turn === 'black' ? '黑棋' : '白棋'}`);

            if (gameMode === 'online' && client && client.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify({
                    type: 'move',
                    sender: clientId,
                    board: board,
                    turn: turn,
                    row: r,
                    col: c,
                    player: player
                }));
                message.destinationName = `jjlab/gomoku/${roomId}`;
                client.send(message);
            }
        }

        function checkWin(r, c, player) {
            const directions = [
                { dr: 0, dc: 1 },  // 水平
                { dr: 1, dc: 0 },  // 垂直
                { dr: 1, dc: 1 },  // 主對角線
                { dr: 1, dc: -1 }  // 副對角線
            ];

            for (let d of directions) {
                let count = 1;
                count += countConsecutive(r, c, d.dr, d.dc, player);
                count += countConsecutive(r, c, -d.dr, -d.dc, player);
                if (count >= 5) return true;
            }
            return false;
        }

        function countConsecutive(r, c, dr, dc, player) {
            let count = 0;
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                count++;
                nr += dr;
                nc += dc;
            }
            return count;
        }

        function makeAIMove() {
            if (gameOver) return;
            let emptyCells = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        emptyCells.push({r, c});
                    }
                }
            }

            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                makeMove(randomCell.r, randomCell.c, 'white');
            }
        }

        function toggleMode() {
            gameMode = (gameMode === 'ai') ? 'online' : 'ai';
            const btn = document.getElementById('mode-btn');
            const rightTitle = document.getElementById('right-player-title');
            
            if (gameMode === 'online') {
                btn.textContent = "切換: 與AI對戰";
                rightTitle.textContent = "白棋 (線上玩家)";
                showLog("已切換為線上模式，請輸入房間代碼加入。");
            } else {
                btn.textContent = "切換: 線上對戰";
                rightTitle.textContent = "白棋 (AI 機器人)";
                document.getElementById('dot-white').classList.add('online');
                document.getElementById('text-white').textContent = "AI 運作中";
                
                document.getElementById('mqtt-global-dot').classList.remove('connected');
                document.getElementById('mqtt-global-text').textContent = "MQTT 狀態：已切換至單人 AI 模式";
                showLog("已切換為單人 AI 模式。");
                resetGame();
            }
        }

        function joinRoom() {
            roomId = document.getElementById('room-input').value.trim();
            if (!roomId) {
                alert("請輸入有效的房間代碼！");
                return;
            }

            if (gameMode !== 'online') {
                alert("請先切換至「線上對戰」模式再加入房間！");
                return;
            }

            showLog(`正在連線到 MQTT 伺服器並加入房間: ${roomId}...`);

            client = new Paho.MQTT.Client("broker.emqx.io", 8084, "gomoku_client_" + Math.random().toString(36).substring(2, 7));

            client.onConnectionLost = (responseObject) => {
                showLog("MQTT 連線中斷: " + responseObject.errorMessage);
                document.getElementById('mqtt-global-dot').classList.remove('connected');
                document.getElementById('mqtt-global-text').textContent = "MQTT 狀態：連線中斷";
            };

            client.onMessageArrived = (message) => {
                try {
                    const data = JSON.parse(message.payloadString);
                    if (data.type === 'move' && data.sender !== clientId) {
                        board = data.board;
                        turn = data.turn;
                        renderBoard();
                        showLog(`收到對手落子，目前輪到：${turn === 'black' ? '黑棋' : '白棋'}`);
                    } else if (data.type === 'chat') {
                        appendChatMessage(data.name, data.text);
                    } else if (data.type === 'join' && data.sender !== clientId) {
                        document.getElementById('dot-white').classList.add('online');
                        document.getElementById('text-white').textContent = `${data.name} (線上)`;
                        appendChatMessage("系統", `${data.name} 已加入房間，對戰開始！`);
                    }
                } catch (e) {
                    console.error("解析訊息失敗", e);
                }
            };

            client.connect({
                useSSL: true,
                onSuccess: () => {
                    showLog("成功連線到 MQTT 伺服器！");
                    client.subscribe(`jjlab/gomoku/${roomId}`);

                    document.getElementById('mqtt-global-dot').classList.add('connected');
                    document.getElementById('mqtt-global-text').textContent = `MQTT 狀態：已連線至房間 [ ${roomId} ]`;

                    document.getElementById('dot-black').classList.add('online');
                    document.getElementById('text-black').textContent = `${playerName} (線上)`;

                    const joinMsg = new Paho.MQTT.Message(JSON.stringify({
                        type: 'join',
                        sender: clientId,
                        name: playerName
                    }));
                    joinMsg.destinationName = `jjlab/gomoku/${roomId}`;
                    client.send(joinMsg);

                    appendChatMessage("系統", "成功加入房間，等待對手連線...");
                },
                onFailure: (err) => {
                    showLog("連線失敗: " + err.errorMessage);
                    document.getElementById('mqtt-global-text').textContent = "MQTT 狀態：連線失敗 (" + err.errorMessage + ")";
                }
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            if (!client || !client.isConnected()) {
                alert("請先加入線上房間才能發送聊天訊息！");
                return;
            }

            const message = new Paho.MQTT.Message(JSON.stringify({
                type: 'chat',
                sender: clientId,
                name: playerName,
                text: text
            }));
            message.destinationName = `jjlab/gomoku/${roomId}`;
            client.send(message);

            appendChatMessage(playerName, text);
            input.value = '';
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function appendChatMessage(name, text) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span>${name}：</span>${text}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
            turn = 'black';
            gameOver = false;
            renderBoard();
            showLog("棋局已重設，黑棋先手。");
        }

        function showLog(text) {
            document.getElementById('game-log').textContent = "狀態：" + text;
        }

        renderBoard();
    </script>
</body>
</html>
